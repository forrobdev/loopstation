<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Loop Station</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="style.css">
    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
    <!-- GSAP -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
</head>
<body>

    <div id="musicPlayingParent">
        <div id="musicPlaying">
            <div id="nowPlaying">
                <p>Now playing</p>
            </div>
            <img id="cover" src="" alt="Pochette de l'album">
            <p id="name">Nom de la musique</p>
            <p id="author">Artiste</p>
        </div>
    </div>
    

    <div style="text-align: center;">
        <h2>Check mon transistor</h2>
        <audio controls autoplay src="/stream"></audio>
    </div>

    <div id="chat"></div>
        <input type="text" id="messageInput" placeholder="Votre message">
    <button id="sendBtn">Envoyer</button>
    
<script src="script.js"></script>
</body>
</html>
